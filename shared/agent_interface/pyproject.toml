[project]
name = "rent-agent-interface"
version = "1.0.0"
description = "Shared agent interface for the Rent an Agent marketplace"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "fastapi>=0.115", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rent_agent_interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
