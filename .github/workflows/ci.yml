name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks git --redact --verbose .

  shared-interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/agent_interface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Validate every agent manifest
        run: python -m rent_agent_interface.validate_all ../..

  platform-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  platform-web:
    # The repo root is an npm workspace; this also type-checks agent pages (agents/*/web).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w platform/web
      - run: npm test -w platform/web
      - run: npm run build -w platform/web

  agents:
    # Runs each agent's backend tests (only for agents that have them yet).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'shared/agent_interface[dev]'
      - name: Test each agent backend
        run: |
          status=0
          for dir in agents/*/backend; do
            [ -d "$dir/tests" ] || { echo "skip $dir (no tests yet)"; continue; }
            echo "::group::$dir"
            [ -f "$dir/requirements.txt" ] && pip install -r "$dir/requirements.txt"
            (cd "$dir" && python -m pytest -q) || status=1
            echo "::endgroup::"
          done
          exit $status
